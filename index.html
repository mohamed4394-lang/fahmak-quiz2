<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>فهمك</title>
<style>body{font-family:Tahoma;background:#eef2ff;padding:15px}.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px}button{background:#4f46e5;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;margin-top:8px;cursor:pointer}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}</style>
</head>
<body>
<div class="card">
<h2>اختبار فهمك 🧠</h2>
<div id="s1"><input id="name" placeholder="الاسم"><input id="age" placeholder="السن"><button onclick="start()">ابدأ الاختبار</button><button onclick="admin()" style="background:#666">دخول المشرف</button></div>
<div id="quiz" style="display:none"></div>
<div id="res" style="display:none"></div>
<div id="adm" style="display:none"></div>
</div>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbxDg7_tHoDX0ziYAtF2kwTVXRO2osPsQ8qzmrHVDDnpjpAOehcQ3qJj9iIHNdhjyMFVOA/exec";
let n="",a="",sc=0,cur=0;
const qs=[{q:"ما عاصمة مصر؟",o:["القاهرة","اسكندرية","الجيزة"],ans:0},{q:"2+2=?",o:["3","4","5"],ans:1},{q:"لون السماء؟",o:["ازرق","احمر","اخضر"],ans:0},{q:"كم يوم في الاسبوع؟",o:["5","7","6"],ans:1}];
function start(){n=document.getElementById('name').value.trim();a=document.getElementById('age').value.trim();if(!n){alert('اكتب اسمك');return;}document.getElementById('s1').style.display='none';document.getElementById('quiz').style.display='block';show();}
function show(){if(cur>=qs.length){finish();return;}let q=qs[cur];document.getElementById('quiz').innerHTML=`<h3>${cur+1}. ${q.q}</h3>`+q.o.map((o,i)=>`<button onclick="ans(${i})" style="background:#fff;color:#333;border:1px solid #ddd">${o}</button>`).join('');}
function ans(i){if(i==qs[cur].ans)sc++;cur++;show();}
function finish(){document.getElementById('quiz').style.display='none';let r=document.getElementById('res');r.style.display='block';r.innerHTML=`<h3>نتيجتك ${sc}/${qs.length}</h3><p>جاري الحفظ...</p>`;let url=`${SHEET_URL}?name=${encodeURIComponent(n)}&age=${encodeURIComponent(a)}&score=${encodeURIComponent(sc+'/'+qs.length)}`;fetch(url,{mode:'no-cors'}).then(()=>{r.innerHTML+=`<p style="color:green">✅ اتحفظ في الشيت العام</p><button onclick="location.reload()">من جديد</button>`;});}
function admin(){let p=prompt('كلمة السر:');if(p!=='fahmak'){alert('خطأ');return;}document.getElementById('s1').style.display='none';let d=document.getElementById('adm');d.style.display='block';d.innerHTML=`<h3>المشرف</h3><button onclick="load()">تحديث من الشيت</button><div id="list"></div><button onclick="location.reload()" style="background:#c00">رجوع</button>`;load();}
function load(){let l=document.getElementById('list');l.innerHTML='تحميل...';fetch(SHEET_URL).then(r=>r.json()).then(data=>{if(!data.length){l.innerHTML='الشيت فاضي';return;}l.innerHTML=data.reverse().map(x=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${x.name}</b> - ${x.age} - ${x.score}<br><small>${new Date(x.date).toLocaleString('ar-EG')}</small></div>`).join('');});}
</script>
</body>
</html>
